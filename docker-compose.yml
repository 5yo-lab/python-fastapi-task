services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    command:
      ["uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgre:
        condition: service_healthy

  postgre:
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

  # Optional pgAdmin instance if no third party DB manager is available, uncomment if needed
  # pgadmin:
  #   image: dpage/pgadmin4
  #   env_file:
  #     - .env
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - internal
  #   depends_on:
  #     - postgre

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
